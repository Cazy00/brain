# setup/consolidator.conf — the ONE agent that runs consolidation.
#
# Any MCP-capable agent can search, read and capture into this brain. Exactly
# one runs consolidation, and it is named here. That asymmetry is deliberate:
#
#   Retrieval is deterministic code, so it is identical on every model. Capture
#   writes only to inbox/, which sits outside default search and is pruned by
#   the next pass, so a bad capture costs almost nothing. ALL of the
#   model-dependent accuracy risk in this system is concentrated in one
#   operation — consolidation's judgement about what gets promoted to permanent
#   knowledge. Pinning one runner removes that risk instead of disclaiming it.
#
# Tracked, not machine-local: the pin has to survive a new machine. Format is
# `key = value`, `#` comments, nothing else — no parser dependency.
#
# CHANGING THE RUNNER: keep the two invocations genuinely different. See
# `audit_cannot_write` below — consolidation refuses to start if the boundary
# is not expressed. The confinement it checks is the Claude CLI's, so another
# runner is refused until bin/brain learns that runner's confinement.

# Pinned deliberately, and deliberately not the most expensive option going.
# This job runs weekly and unattended; the model name will go stale long before
# the constraint does — and on 2026-07-31 it had. The pin moved from
# claude-opus-4-8 to claude-opus-5 for two reasons and not a third: they cost
# the SAME ($5/$25 per MTok), and the newer one is materially better at exactly
# the judgement this job exists to make. Cost was never the constraint here —
# a run reads a few thousand tokens today and a few hundred thousand on a
# mature brain, so the whole question is quality, and quality is the one thing
# concentrated in this operation.
#
# Moving the MODEL is not moving the RUNNER: `audit_cannot_write` below is a
# property of the Claude CLI, and it is unchanged. The warning above about
# re-establishing that boundary applies to swapping the runner, not the model.
#
# What DID need handling: this model expands task scope and over-verifies more
# readily than its predecessor. The consolidation prompt now states its scope
# explicitly rather than relying on the model to infer it.
#
# 2026-10-15 (v0.3.0): re-pinned to claude-opus-5-5 on evidence, not on the
# version number — see model_reason, which `consolidate --dry-run` prints. Both
# candidates audited the same three fixtures in the confined auditor; both were
# right on all three, so the newer and faster one won.
model = claude-opus-5-5
model_reason = 2026-10-15 live check: with the confined audit line and the shipped audit prompt, claude-opus-5 and claude-opus-5-5 both blocked a planted private item and a planted contradiction and passed a clean note; claude-opus-5-5 is the newer model and answered 2-4x faster.

# The WRITE-CAPABLE invocation. Drains the inbox, promotes, supersedes, commits.
# `{model}` is substituted; the prompt is appended as the final argument, so it
# is never interpolated into a shell string. It loads no MCP servers (required:
# it reads untrusted transcripts, and an MCP tool could write around the audit).
# In a split layout the notes and the engine are apart: --add-dir {engine} lets the pass read
# AGENTS.md, and --allowedTools lets it run the toolbelt's note commands and read-only git, by
# absolute path. Nothing else is allowed to run ({engine} is substituted like {model}).
propose = claude --model {model} --output-format json --permission-mode acceptEdits --strict-mcp-config --mcp-config '{"mcpServers":{}}' --add-dir {engine} --allowedTools "Bash({engine}/bin/brain lint)" "Bash({engine}/bin/brain lint *)" "Bash({engine}/bin/brain search *)" "Bash({engine}/bin/brain read *)" "Bash({engine}/bin/brain links *)" "Bash({engine}/bin/brain recent *)" "Bash({engine}/bin/brain new *)" "Bash({engine}/bin/brain supersede *)" "Bash({engine}/bin/brain index)" "Bash({engine}/bin/brain index *)" "Bash(git status *)" "Bash(git diff *)" "Bash(git log *)" "Bash(git rev-parse *)" -p

# The READ-ONLY invocation. Audits the staged diff and can only return a
# verdict. This is a security boundary, not a second opinion: two invocations
# with identical write permissions would be theatre.
#
# Confined (2.3), and every flag is required — consolidation refuses an audit
# line missing any of them, or carrying any flag beyond --model, -p,
# --output-format json and these:
#   --safe-mode               no CLAUDE.md, skills, plugins, hooks or MCP servers
#   --restricted              no command-running tools; file tools confined to
#                             the working directory (a read-only snapshot)
#   --strict-mcp-config + an empty --mcp-config   no MCP at all, so no brain_capture
#   --tools Read              the one tool it has
#   --permission-prompts none anything that would prompt is denied
#   --no-session-persistence  nothing of the run is kept
# It must END on a switch: --tools is variadic and would swallow the prompt.
#
# --output-format json, on both lines, grants nothing: it prints the answer as
# one JSON object whose `result` is the text (the auditor's verdict is the last
# VERDICT line of it) and whose total_cost_usd and usage give the call's cost
# and tokens, which consolidate reports on its result line. It is the one flag
# the audit line may carry beyond the confinement, and only with that value.
# Without it the answer is plain text and the cost is reported as unknown.
audit = claude --model {model} --output-format json -p --safe-mode --restricted --strict-mcp-config --mcp-config '{"mcpServers":{}}' --tools Read --permission-prompts none --no-session-persistence

# HOW the audit invocation is prevented from writing — for THIS runner, in
# plain words. Required, and required to be a real answer.
#
# The property does NOT travel with the command string. It is a fact about the
# specific tool: for the Claude CLI it comes from the ABSENCE of a flag, so a
# second runner that writes by default would inherit "read-only" while being
# nothing of the kind. Whoever swaps the runner has to re-establish this and
# write down how, or consolidation will not run.
audit_cannot_write = The auditor's only tool is Read, and --restricted confines
  it to its working directory, which is a fresh read-only snapshot of the
  staged tree (symlinks refused, deleted afterwards). It loads no MCP servers,
  hooks, skills or plugins, and anything that would prompt is denied. Only the
  propose invocation opts into writes, with --permission-mode acceptEdits. The
  auditor is additionally blinded to the session digest by moving that file
  out of the repo for the duration.

# Seconds. propose does real work on a large corpus; audit reads one diff.
propose_timeout = 1800
audit_timeout = 900
